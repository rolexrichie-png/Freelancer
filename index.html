<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danny Hub | Freelance Services</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #02060d;
      color: white;
      line-height: 1.5;
      padding-bottom: 80px;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* HEADER */
    header {
      padding: 18px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #030912;
      border-bottom: 1px solid #12304f;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
    }

    .logo span {
      color: #087cff;
    }

    .nav {
      display: flex;
      gap: 25px;
    }

    .nav a {
      color: #cbd5e1;
      font-size: 14px;
    }

    .nav a:hover {
      color: #087cff;
    }

    .header-btn {
      background: #087cff;
      padding: 11px 18px;
      border-radius: 9px;
      font-weight: bold;
    }

    /* MAIN */
    .container {
      width: 92%;
      max-width: 1200px;
      margin: auto;
    }

    /* HERO */
    .hero {
      margin-top: 25px;
      padding: 45px 35px;
      border: 1px solid #087cff;
      border-radius: 22px;
      background:
        radial-gradient(circle at 80% 30%, rgba(0, 119, 255, .35), transparent 35%),
        linear-gradient(135deg, #02050b, #031936);
    }

    .welcome {
      display: inline-block;
      background: #073b91;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .hero h1 {
      font-size: clamp(45px, 8vw, 72px);
      line-height: 1;
      margin-bottom: 15px;
    }

    .hero h1 span {
      color: #087cff;
    }

    .hero h2 {
      font-size: 22px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #b6c1cf;
      max-width: 650px;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .primary,
    .secondary {
      padding: 13px 22px;
      border-radius: 9px;
      font-weight: bold;
      display: inline-block;
    }

    .primary {
      background: #087cff;
    }

    .secondary {
      border: 1px solid #087cff;
    }

    /* SECTIONS */
    section {
      margin-top: 35px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .section-title h2 {
      font-size: 18px;
    }

    .section-title h2::before {
      content: "";
      width: 8px;
      height: 8px;
      background: #087cff;
      display: inline-block;
      border-radius: 50%;
      margin-right: 8px;
    }

    .view {
      color: #4b9cff;
      font-size: 13px;
    }

    /* SERVICE BOXES */
    .services {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }

    .card {
      background: #080e17;
      border: 1px solid #263342;
      border-radius: 14px;
      padding: 20px;
      min-height: 250px;
      transition: .3s;
    }

    .card:hover {
      border-color: #087cff;
      transform: translateY(-4px);
    }

    .icon {
      font-size: 34px;
      margin-bottom: 15px;
    }

    .card h3 {
      font-size: 16px;
      margin-bottom: 9px;
    }

    .card p {
      color: #aeb8c5;
      font-size: 13px;
    }

    .price {
      margin-top: 18px;
      background: #052b68;
      padding: 9px;
      text-align: center;
      border-radius: 8px;
      font-weight: bold;
    }

    .price small {
      display: block;
      color: #a8caff;
      font-size: 10px;
      font-weight: normal;
    }

    /* QUICK SERVICES */
    .quick {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
    }

    .quick-box {
      background: #080e17;
      border: 1px solid #263342;
      border-radius: 12px;
      padding: 18px 8px;
      text-align: center;
    }

    .quick-box:hover {
      border-color: #087cff;
    }

    .quick-box div {
      font-size: 25px;
      margin-bottom: 7px;
    }

    .quick-box span {
      font-size: 12px;
    }

    /* HOW IT WORKS */
    .steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .step {
      background: #080e17;
      border: 1px solid #263342;
      border-radius: 14px;
      padding: 22px;
      text-align: center;
    }

    .number {
      width: 42px;
      height: 42px;
      background: #087cff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 13px;
      font-weight: bold;
    }

    .step p {
      color: #aeb8c5;
      font-size: 13px;
      margin-top: 7px;
    }

    /* BENEFITS */
    .benefits {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }

    .benefit {
      background: #080e17;
      border: 1px solid #263342;
      border-radius: 14px;
      padding: 22px 12px;
      text-align: center;
    }

    .benefit-icon {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .benefit h3 {
      font-size: 14px;
      margin-bottom: 6px;
    }

    .benefit p {
      color: #aeb8c5;
      font-size: 12px;
    }

    /* CTA */
    .cta {
      background: linear-gradient(100deg, #031c4c, #063c9a);
      border: 1px solid #087cff;
      border-radius: 17px;
      padding: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .cta p {
      color: #c7d5e8;
      font-size: 13px;
    }

    /* FOOTER */
    footer {
      margin-top: 40px;
      padding: 25px;
      text-align: center;
      color: #7f8b99;
      border-top: 1px solid #17212e;
      font-size: 12px;
    }

    /* MOBILE NAV */
    .mobile-nav {
      display: none;
    }

    /* TABLET */
    @media (max-width: 1000px) {
      .services {
        grid-template-columns: repeat(3, 1fr);
      }

      .quick {
        grid-template-columns: repeat(3, 1fr);
      }

      .benefits {
        grid-template-columns: repeat(3, 1fr);
      }

      .steps {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* PHONE */
    @media (max-width: 700px) {

      .nav,
      .header-btn {
        display: none;
      }

      .hero {
        padding: 35px 22px;
      }

      .hero h1 {
        font-size: 48px;
      }

      .services {
        grid-template-columns: repeat(2, 1fr);
      }

      .quick {
        grid-template-columns: repeat(2, 1fr);
      }

      .steps {
        grid-template-columns: 1fr;
      }

      .benefits {
        grid-template-columns: repeat(2, 1fr);
      }

      .cta {
        flex-direction: column;
        align-items: flex-start;
      }

      .mobile-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 68px;
        background: #050b13;
        border-top: 1px solid #263342;
        display: flex;
        justify-content: space-around;
        align-items: center;
        z-index: 2000;
      }

      .mobile-nav a {
        text-align: center;
        color: #9ba7b5;
        font-size: 10px;
      }

      .mobile-nav span {
        display: block;
        font-size: 20px;
      }

      .mobile-nav .active {
        color: #087cff;
      }
    }

    @media (max-width: 430px) {

      .services {
        grid-template-columns: 1fr;
      }

      .benefits {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 42px;
      }
    }
  </style>
</head>
