<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Danny Hub | Freelance Services</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #02060d;
      color: #fff;
      line-height: 1.5;
      padding-bottom: 85px;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ================= HEADER ================= */

    header {
      width: 100%;
      padding: 20px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0, 119, 255, 0.2);
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(2, 6, 13, 0.95);
      backdrop-filter: blur(12px);
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo span {
      color: #087cff;
    }

    .nav {
      display: flex;
      gap: 30px;
      align-items: center;
    }

    .nav a {
      color: #ddd;
      font-size: 15px;
      transition: 0.3s;
    }

    .nav a:hover,
    .nav a.active {
      color: #087cff;
    }

    .order-btn {
      background: linear-gradient(135deg, #087cff, #0054d9);
      padding: 12px 20px;
      border-radius: 9px;
      font-weight: bold;
      box-shadow: 0 0 20px rgba(0, 119, 255, 0.25);
      transition: 0.3s;
    }

    .order-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(0, 119, 255, 0.45);
    }

    /* ================= HERO ================= */

    .container {
      width: 92%;
      max-width: 1250px;
      margin: auto;
    }

    .hero {
      margin-top: 25px;
      min-height: 350px;
      padding: 55px;
      border: 1px solid #086cff;
      border-radius: 22px;
      background:
        radial-gradient(circle at 75% 40%, rgba(0, 93, 255, 0.35), transparent 35%),
        linear-gradient(135deg, #02050b, #031536);
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .hero-content {
      max-width: 650px;
      position: relative;
      z-index: 2;
    }

    .welcome {
      display: inline-block;
      background: #073b91;
      padding: 6px 15px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 70px);
      line-height: 1;
      margin-bottom: 15px;
    }

    .hero h1 span {
      color: #087cff;
    }
