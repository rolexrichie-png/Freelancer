<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Danny Hub | Place Order</title>

  <style>
    /* ==================================================
       DANNY HUB - ORDER PAGE
       ================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #02060d;
      color: #ffffff;
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: 50px;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    /* ==================================================
       HEADER
       ================================================== */

    header {
      width: 100%;
      padding: 18px 5%;
      background: rgba(3, 9, 18, 0.97);
      border-bottom: 1px solid #12304f;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo span {
      color: #087cff;
    }

    .back-home {
      color: #a9b8c9;
      font-size: 14px;
      transition: 0.3s;
    }

    .back-home:hover {
      color: #087cff;
    }

    /* ==================================================
       MAIN CONTAINER
       ================================================== */

    .container {
      width: 92%;
      max-width: 1050px;
      margin: 30px auto;
    }

    /* ==================================================
       PAGE TITLE
       ================================================== */

    .page-title {
      text-align: center;
      margin-bottom: 25px;
    }

    .badge {
      display: inline-block;
      background: #073b91;
      color: #ffffff;
      padding: 6px 15px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .page-title h1 {
      font-size: clamp(35px, 7vw, 52px);
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .page-title h1 span {
      color: #087cff;
    }

    .page-title p {
      color: #9ba8b8;
      font-size: 14px;
    }

    /* ==================================================
       PROGRESS
       ================================================== */

    .progress-box {
      background: #080e17;
      border: 1px solid #263342;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .progress {
      display: flex;
      justify-content: space-between;
      position: relative;
    }

      content: "";
      position: absolute;
      top: 17px;
      left: 8%;
      right: 8%;
      height: 2px;
      background: #263342;
